name: Supabase keep-alive

# Los proyectos gratuitos de Supabase se pausan tras ~7 días sin actividad.
on:
  schedule:
    - cron: "0 12 * * 1,4"   # lunes y jueves 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Consulta ligera a la API REST
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/rpc_health" \
            -H "Content-Type: application/json" -d '{}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
